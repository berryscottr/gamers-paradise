# Weekly dependency updates as PRs into main (they go through CI like
# everything else). Actions stay pinned to SHAs; Dependabot bumps the SHA
# and the version comment together.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /.railway
    schedule:
      interval: monthly
